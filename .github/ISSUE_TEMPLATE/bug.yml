name: Bug report
description: Report incorrect behavior, output, or a regression
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Please remove private paths and identities. `--redact strict` can help.
  - type: input
    id: version
    attributes:
      label: mactriage version
      placeholder: mactriage v0.4.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: macOS 15.5, arm64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and result
      description: Include the command, exit code, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private paths, and unrelated log content.
          required: true
