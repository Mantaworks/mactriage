name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Passive macOS integration test
        run: go test -tags=integration ./internal/macos -run '^TestIntegration'
      - name: Cross-build supported architectures
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath ./cmd/mactriage
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath ./cmd/mactriage
          rm -f mactriage
      - name: Generate documentation
        run: |
          go run ./cmd/gen-docs "$RUNNER_TEMP/generated"
          test -s "$RUNNER_TEMP/generated/man/mactriage.1"
          test -s "$RUNNER_TEMP/generated/completions/_mactriage"
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
