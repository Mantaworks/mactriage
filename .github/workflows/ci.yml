name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Passive macOS integration test
        run: go test -tags=integration ./internal/macos -run '^TestIntegration'
      - name: Cross-build supported architectures
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath ./cmd/mactriage
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath ./cmd/mactriage
          rm -f mactriage
      - name: Verify reproducible builds
        run: scripts/check-reproducible.sh
      - name: Generate documentation
        run: |
          go run ./cmd/gen-docs "$RUNNER_TEMP/generated"
          test -s "$RUNNER_TEMP/generated/man/mactriage.1"
          test -s "$RUNNER_TEMP/generated/completions/_mactriage"
      - name: Validate Homebrew formula generator
        env:
          MACTRIAGE_SOURCE_URL: https://github.com/Mantaworks/mactriage/archive/${{ github.sha }}.tar.gz
        run: |
          ci_tap="$RUNNER_TEMP/homebrew-ci"
          mkdir -p "$ci_tap/Formula"
          git -C "$ci_tap" init
          scripts/render-homebrew-formula.sh v0.0.0 "$ci_tap/Formula/mactriage.rb"
          tap_dir="$(brew --repository)/Library/Taps/mantaworks/homebrew-ci"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$ci_tap" "$tap_dir"
          brew style Mantaworks/ci
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
