name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Require Homebrew tap credential
        run: test -n "$HOMEBREW_TAP_TOKEN"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Test release commit
        run: go test -race ./...
      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --timeout 30m
      - name: Check out Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v7
        with:
          repository: Mantaworks/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update source-built Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" homebrew-tap/Formula/mactriage.rb
          cd homebrew-tap
          git config user.name "mactriage release bot"
          git config user.email "actions@github.com"
          git add Formula/mactriage.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update mactriage to $GITHUB_REF_NAME"
          git push origin HEAD:main
