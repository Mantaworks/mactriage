name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: macos-14
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: true
      - name: Require Homebrew tap credential
        run: test -n "$HOMEBREW_TAP_TOKEN"
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Test release commit
        run: go test -race ./...
      - name: Publish release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --timeout 30m
      - name: Attest release archives, checksums, and SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/*.sbom.json
      - name: Check out Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Mantaworks/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update source-built Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          scripts/render-homebrew-formula.sh "$GITHUB_REF_NAME" homebrew-tap/Formula/mactriage.rb
          cd homebrew-tap
          git config user.name "mactriage release bot"
          git config user.email "actions@github.com"
          git add Formula/mactriage.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update mactriage to $GITHUB_REF_NAME"
          git push origin HEAD:main
