version: 2

project_name: mactriage

before:
  hooks:
    - go mod tidy
    - go run ./cmd/gen-docs docs/generated

builds:
  - id: mactriage
    main: ./cmd/mactriage
    binary: mactriage
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: release
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: docs/generated/man/*
        dst: man
      - src: docs/generated/completions/*
        dst: completions

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
  name_template: "mactriage {{ .Tag }} — The Follow-Through Release"
